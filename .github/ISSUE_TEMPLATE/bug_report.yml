name: Bug Report
description: Create a report to help us improve SmartHire API
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this behavior?
      placeholder: |
        1. Send POST to `/api/v1/...`
        2. With payload {...}
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Python version, OS, Database used
      placeholder: Python 3.11, Ubuntu 22.04, PostgreSQL 15
